<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vanna gaming Top up</title>
  <!-- Google Font: Orbitron & Kantumruy Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header Section -->
  <header class="header">
    <!-- ផ្នែក Banner Cover ធំ (បង្ហាញ ៦ រូបភាពឆ្លាស់គ្នា) -->
    <div class="banner-fader">
      <img class="fade-img active" src="MLBB_icon.webp" alt="Mobile Legends Banner">
      <img class="fade-img" src="Roblox_(2025)_(App_Icon).svg.webp" alt="Roblox Banner">
      <img class="fade-img" src="free-fire-max-thumbnail.webp" alt="Free Fire Banner">
      <img class="fade-img" src="b0d49366547f17e99bc85637e464d438.png" alt="Magic Chess Banner">
      <img class="fade-img" src="photo_2026-08-27_18-43-29.jpg" alt="Banner 5">
      <img class="fade-img" src="photo_2026-08-27_18-53-23.jpg" alt="Banner 6">
    </div>

    <h1>Vanna gaming</h1>
  </header>

  <!-- Game Cards Grid -->
  <main class="game-grid">

    <!-- Card 1 -->
    <div class="card">
      <div class="card-image-wrapper">
        <img class="thumbnail" src="MLBB_icon.webp" alt="Mobile Legends">
      </div>
      <div class="card-title">Mobile Legends</div>
      <a href="MobileLegends.html" class="btn-select">ជ្រើសរើស</a>
    </div>

    <!-- Card 2 -->
    <div class="card">
      <div class="card-image-wrapper">
        <img class="thumbnail" src="MLBB_icon.webp" alt="MLBB INDO">
      </div>
      <div class="card-title">MLBB INDO</div>
      <a href="MobileLegends.html" class="btn-select">ជ្រើសរើស</a>
    </div>

    <!-- Card 3 -->
    <div class="card">
      <div class="card-image-wrapper">
        <img class="thumbnail" src="MLBB_icon.webp" alt="MLBB SG/MY">
      </div>
      <div class="card-title">MLBB SG/MY</div>
      <a href="MobileLegends.html" class="btn-select">ជ្រើសរើស</a>
    </div>

    <!-- Card 4 -->
    <div class="card">
      <div class="card-image-wrapper">
        <img class="thumbnail" src="Roblox_(2025)_(App_Icon).svg.webp" alt="Roblox">
      </div>
      <div class="card-title">Roblox</div>
      <a href="Roblox.html" class="btn-select">ជ្រើសរើស</a>
    </div>

    <!-- Card 5 -->
    <div class="card">
      <div class="card-image-wrapper">
        <img class="thumbnail" src="free-fire-max-thumbnail.webp" alt="Free Fire SGMY">
      </div>
      <div class="card-title">Free Fire</div>
      <a href="Freefire.html" class="btn-select">ជ្រើសរើស</a>
    </div>

    <!-- Card 6 -->
    <div class="card">
      <div class="card-image-wrapper">
        <img class="thumbnail" src="b0d49366547f17e99bc85637e464d438.png" alt="Magic Chess GoGo">
      </div>
      <div class="card-title">Magic Chess GoGo</div>
      <a href="magic.html" class="btn-select">ជ្រើសរើស</a>
    </div>

  </main>

  <!-- JavaScript ធ្វើឱ្យរូបភាពទាំង ៦ លោតឆ្លាស់គ្នា -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const images = document.querySelectorAll(".banner-fader .fade-img");
      let currentIndex = 0;

      // ប្តូររូបភាពរៀងរាល់ 3 វិនាទី (3000ms)
      setInterval(() => {
        images[currentIndex].classList.remove("active");
        currentIndex = (currentIndex + 1) % images.length;
        images[currentIndex].classList.add("active");
      }, 3000);
    });
  </script>

</body>
</html>
